<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="htmx-config" content='{"allowEval": false}'>
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="{{ url_for('pwa.manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='pwa/apple-touch-icon.png') }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Panel">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Panel serwerów</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='vendor/htmx-1.9.12.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='pwa.js') }}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
  {% if current_user.is_authenticated %}
  <header><nav class="row"><b>Panel</b>
    <a href="{{ url_for('main.dashboard') }}">Serwery</a>
    <a href="{{ url_for('dock.docker_page') }}">Docker</a>
    <a href="{{ url_for('dock.stacks_page') }}">Stosy</a>{% if camera_enabled %}
    <a href="{{ url_for('cam.camera_page') }}">Kamera</a>{% endif %}
    <a href="{{ url_for('notif.page') }}">Powiadomienia</a></nav>
    <form method="post" action="{{ url_for('main.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="ghost">Wyloguj</button></form></header>
  {% endif %}
  <main>{% block body %}{% endblock %}</main>
</body></html>
