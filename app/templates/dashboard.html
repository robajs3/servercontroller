{% extends "base.html" %}{% block body %}
<section class="card">
  <h3>{{ config.MAIN_NAME }}</h3>
  <div hx-get="{{ url_for('main.status') }}" hx-trigger="load, refresh-status from:body, every 5s [document.visibilityState=='visible']">…</div>
  <div class="row">
    <button hx-post="{{ url_for('main.act_wake') }}" hx-target="#act" hx-confirm="Wysłać Wake-on-LAN?">Włącz (WoL)</button>
    <form class="row" hx-post="{{ url_for('main.act_shutdown') }}" hx-target="#act" hx-confirm="Na pewno wyłączyć serwer?">
      <input type="password" name="password" placeholder="Hasło" autocomplete="current-password" required style="width:11rem">
      <button class="danger">Wyłącz</button>
    </form>
  </div>
  <div id="act"></div>
</section>
<section class="card">
  <div class="row"><h3>Ping</h3>
    {% for r in ['1h','6h','24h','7d','30d'] %}<button class="ghost rng" data-r="{{ r }}">{{ r }}</button>{% endfor %}</div>
  <canvas id="chart" height="110"></canvas>
</section>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
let chart, range = '1h';
async function load() {
  const d = await (await fetch('/api/ping?range=' + range)).json();
  const labels = d.map(x => new Date(x.t));
  const data = { labels, datasets: [
    {label: 'ping śr. (ms)', data: d.map(x => x.rtt), borderColor: '#4ade80', pointRadius: 0, tension: .2, yAxisID: 'y', spanGaps: false},
    {label: 'max (ms)', data: d.map(x => x.max), borderColor: '#60a5fa55', pointRadius: 0, yAxisID: 'y'},
    {label: 'utrata (%)', type: 'bar', data: d.map(x => x.loss), backgroundColor: '#f87171', yAxisID: 'y1'}]};
  if (chart) { chart.data = data; chart.update('none'); return; }
  chart = new Chart(document.getElementById('chart'), {type: 'line', data, options: {
    animation: false, interaction: {mode: 'index', intersect: false},
    scales: {x: {type: 'category', ticks: {maxTicksLimit: 8, callback(v) {
        const t = this.getLabelForValue(v); return t.toLocaleString('pl', range.endsWith('d') ? {day:'2-digit',month:'2-digit',hour:'2-digit'} : {hour:'2-digit',minute:'2-digit'}); }}},
      y: {beginAtZero: true, title: {display: true, text: 'ms'}},
      y1: {position: 'right', min: 0, max: 100, grid: {drawOnChartArea: false}}}}});
}
document.querySelectorAll('.rng').forEach(b => b.onclick = () => { range = b.dataset.r; load(); });
load(); setInterval(() => document.visibilityState === 'visible' && load(), 15000);
</script>{% endblock %}
